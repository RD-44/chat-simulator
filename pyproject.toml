[project]
name = "chat-simulator"
version = "0.1.0"
description = "A fun tool to simulate the dynamics of a group chat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
]
